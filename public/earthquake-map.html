<!DOCTYPE html>
<!--
  Карта землетрясений — самодостаточный HTML-виджет
  Данные: USGS (public domain) + eqalert.ru — открытый API ФИЦ ЕГС РАН (сейсмичность РФ)
  Плитки: Esri Light/Dark Gray Canvas (без API-ключей)
  Работает без сервера: откройте файл в браузере или загрузите на любой хостинг.

  Встраивание через iframe:
  <iframe src="earthquake-map.html" width="100%" height="600" frameborder="0"
          style="border:0;border-radius:12px;overflow:hidden"
          loading="lazy" title="Карта землетрясений"></iframe>
-->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Карта землетрясений · USGS + eqalert.ru</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css">
<style>
  :root{
    --bg:#eef0f3; --panel:rgba(255,255,255,.93); --line:rgba(20,30,45,.1);
    --txt:#1b1f24; --dim:#5d6672; --accent:#ff6b4a; --solid:#ffffff;
    --chip:rgba(25,35,55,.05); --chip-hover:rgba(25,35,55,.12);
    --link:#2f63c4; --warn:#b96a00; --err:#d64545;
    --attr-bg:rgba(255,255,255,.8); --bar-bg:#ffffff; --bar-hover:#eef0f3;
    --bar-line:rgba(20,30,45,.14); --shadow:0 10px 30px rgba(30,42,66,.14);
  }
  body.dark{
    --bg:#0a0c0f; --panel:rgba(14,16,20,.88); --line:rgba(255,255,255,.09);
    --txt:#e9ebee; --dim:#98a0a8; --solid:#12151a;
    --chip:rgba(255,255,255,.05); --chip-hover:rgba(255,255,255,.12);
    --link:#8ec1ff; --warn:#ffb14d; --err:#ff7676;
    --attr-bg:rgba(10,12,14,.72); --bar-bg:#14171c; --bar-hover:#1d2127;
    --bar-line:rgba(255,255,255,.09); --shadow:0 10px 30px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;width:100%;height:100%;background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color:var(--txt);overscroll-behavior:none}
  #map{position:fixed;inset:0;background:var(--bg)}
  .leaflet-container{background:var(--bg);font:inherit}

  /* ── панель (шапка) ─────────────────────────── */
  #panel{position:fixed;top:14px;left:14px;z-index:1000;max-width:330px;
    background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:14px 16px 12px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    box-shadow:var(--shadow)}
  #panel h1{margin:0 0 2px;font-size:16px;font-weight:700;letter-spacing:.2px;
    display:flex;align-items:center;gap:8px}
  #panel h1 .dot{width:9px;height:9px;border-radius:50%;background:#ff5c47;
    box-shadow:0 0 0 0 rgba(255,92,71,.55);animation:beat 2.2s infinite;flex:none}
  @keyframes beat{0%{box-shadow:0 0 0 0 rgba(255,92,71,.5)}70%{box-shadow:0 0 0 9px rgba(255,92,71,0)}100%{box-shadow:0 0 0 0 rgba(255,92,71,0)}}
  #panel .sub{font-size:11.5px;color:var(--dim);margin:0 0 11px}
  #stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px}
  #stats .st{background:var(--chip);border:1px solid var(--line);
    border-radius:10px;padding:7px 8px;min-width:0}
  #stats .st b{display:block;font-size:14.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #stats .st span{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
  #stats .st b small{font-size:11px;font-weight:600;color:var(--dim)}
  #foot{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--dim)}
  #foot .status{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #foot .status.err{color:var(--err)}
  #refresh{flex:none;border:1px solid var(--line);background:var(--chip);
    color:var(--txt);font:inherit;font-size:12px;padding:5px 12px;border-radius:9px;cursor:pointer;
    transition:background .15s}
  #refresh:hover{background:var(--chip-hover)}
  #refresh[disabled]{opacity:.5;cursor:wait}

  /* ── легенда ────────────────────────────────── */
  #legend{position:fixed;right:14px;bottom:26px;z-index:1000;background:var(--panel);
    border:1px solid var(--line);border-radius:14px;padding:10px 13px;font-size:11.5px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:var(--shadow)}
  #legend .t{font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.6px;
    color:var(--dim);margin-bottom:7px}
  #legend .row{display:flex;align-items:center;gap:7px;margin:3px 0;color:var(--txt)}
  #legend .row i{width:11px;height:11px;border-radius:50%;flex:none;box-shadow:0 0 6px currentColor}

  /* ── пульс сильных толчков ──────────────────── */
  .eq-ring{position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px 0 0 -35px;
    border-radius:50%;border:2px solid;pointer-events:none;animation:ring 2.6s ease-out infinite}
  @keyframes ring{0%{transform:scale(.3);opacity:.85}75%{transform:scale(1);opacity:0}100%{transform:scale(1);opacity:0}}

  /* ── попапы и тултипы в светлой теме ────────── */
  .eq-popup .leaflet-popup-content-wrapper{background:var(--solid);color:var(--txt);
    border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
  .eq-popup .leaflet-popup-tip{background:var(--solid);border:1px solid var(--line)}
  .eq-popup .leaflet-popup-content{margin:13px 15px;line-height:1.45}
  .eq-popup a{color:var(--link)}
  .eqp .m{font-size:21px;font-weight:800;letter-spacing:.3px;margin-bottom:1px}
  .eqp .p{font-size:13px;font-weight:600;margin-bottom:8px}
  .eqp table{width:100%;border-collapse:collapse;font-size:12px;color:var(--dim)}
  .eqp td{padding:2.5px 0;vertical-align:top}
  .eqp td:first-child{color:var(--dim);padding-right:12px;white-space:nowrap}
  .eqp td:last-child{color:var(--txt);text-align:right}
  .eqp .warn{margin-top:7px;font-size:11.5px;color:var(--warn)}
  .eqp .lnk{display:inline-block;margin-top:9px;font-size:12px;text-decoration:none}
  .eqp .lnk:hover{text-decoration:underline}
  .eq-tip{background:var(--solid);border:1px solid var(--line);color:var(--txt);
    border-radius:8px;font-size:12px;box-shadow:0 4px 14px rgba(30,42,66,.15)}
  .eq-tip::before{display:none}

  .leaflet-control-attribution{background:var(--attr-bg)!important;color:var(--dim)!important;
    font-size:10px!important;backdrop-filter:blur(6px)}
  .leaflet-control-attribution a{color:var(--link)!important}
  .leaflet-bar a{background:var(--bar-bg)!important;color:var(--txt)!important;border-color:var(--bar-line)!important}
  .leaflet-bar a:hover{background:var(--bar-hover)!important}

  /* ── переключатель темы, фильтр магнитуды, авто ── */
  #theme{margin-left:auto;flex:none;width:28px;height:28px;display:inline-flex;align-items:center;
    justify-content:center;border:1px solid var(--line);background:var(--chip);color:var(--txt);
    border-radius:9px;cursor:pointer;padding:0}
  #theme:hover{background:var(--chip-hover)}
  #theme svg{width:15px;height:15px}
  #theme .ic-moon path{fill:currentColor}
  #theme .ic-sun{display:none}
  body.dark #theme .ic-sun{display:block}
  body.dark #theme .ic-moon{display:none}
  #filter{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:11px;color:var(--dim)}
  #filter .chips{display:flex;gap:4px;flex:1;min-width:0}
  #filter .chips button{flex:1;border:1px solid var(--line);background:var(--chip);color:var(--txt);
    font:inherit;font-size:11.5px;padding:4px 0;border-radius:8px;cursor:pointer;transition:background .15s}
  #filter .chips button:hover{background:var(--chip-hover)}
  #filter .chips button.on{background:#3b6fd4;border-color:#3b6fd4;color:#fff}
  #auto{flex:none;border:1px solid var(--line);background:var(--chip);color:var(--txt);
    font:inherit;font-size:11.5px;border-radius:9px;padding:4px 4px;cursor:pointer}
  #rf-row{display:flex;align-items:center;gap:7px;margin:-5px 0 10px;font-size:11.5px}
  #rf-row .sw{width:11px;height:11px;border-radius:50%;border:1.5px dashed #2f63c4;flex:none}
  #rf-row input{accent-color:#3b6fd4;margin:0;flex:none}
  #rf-row label{cursor:pointer;color:var(--dim);flex:1;min-width:0}
  #rf-row label a{color:var(--link);text-decoration:none}
  #rf-row b{flex:none;font-weight:600;color:var(--txt)}

  #presets{margin-bottom:10px;border-top:1px solid var(--line);padding-top:10px}
  #presets .ph{display:flex;align-items:center;justify-content:space-between;
    font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);
    font-weight:700;margin-bottom:7px}
  #presets .ph a{font-size:11px;text-transform:none;letter-spacing:0;color:var(--link);
    text-decoration:none;font-weight:600}
  #presets .ph a:hover{text-decoration:underline}
  #presets .grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
  #presets button{border:1px solid var(--line);background:var(--chip);color:var(--txt);
    font:inherit;font-size:10.5px;padding:5px 6px;border-radius:8px;cursor:pointer;
    transition:background .15s;text-align:left;line-height:1.25}
  #presets button:hover{background:var(--chip-hover)}
  #presets button b{display:block;font-weight:700;font-size:11px;margin-bottom:1px}
  #presets button small{color:var(--dim);font-size:9.5px}

  @media (max-width:640px){
    #panel{max-width:calc(100vw - 28px)}
    #stats .st b{font-size:13px}
    #legend{display:none}
  }
</style>
</head>
<body>
<div id="map"></div>

<header id="panel">
  <h1><span class="dot"></span>Карта землетрясений
    <button id="theme" type="button" aria-label="Сменить тему">
      <svg class="ic-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </h1>
  <p class="sub">USGS · 24 часа · РФ: eqalert.ru (ФИЦ ЕГС РАН)</p>
  <div id="filter">
    <span>Магнитуда</span>
    <div class="chips">
      <button type="button" data-m="0" class="on">Все</button>
      <button type="button" data-m="2">2+</button>
      <button type="button" data-m="4.5">4.5+</button>
      <button type="button" data-m="6">6+</button>
    </div>
  </div>
  <div id="rf-row">
    <span class="sw"></span>
    <input type="checkbox" id="rf-on" checked>
    <label for="rf-on">РФ и сопредельные районы · <a href="https://eqalert.ru" target="_blank" rel="noopener">eqalert.ru</a></label>
    <b id="rf-count">—</b>
  </div>
  <div id="presets">
    <div class="ph">
      <span>Реальные землетрясения</span>
      <a href="https://earthquake.usgs.gov/earthquakes/browse/" target="_blank" rel="noopener">история →</a>
    </div>
    <div class="grid" id="presets-grid"></div>
  </div>
  <div id="stats">
    <div class="st"><b id="st-count">—</b><span>событий</span></div>
    <div class="st"><b id="st-max">—</b><span>сильнейшее</span></div>
    <div class="st"><b id="st-last">—</b><span>последнее</span></div>
  </div>
  <div id="foot">
    <div class="status" id="status">Загрузка данных…</div>
    <select id="auto" title="Автообновление">
      <option value="0">Авто: выкл</option>
      <option value="60">1 мин</option>
      <option value="120" selected>2 мин</option>
      <option value="300">5 мин</option>
    </select>
    <button id="refresh" type="button">Обновить</button>
  </div>
</header>

<div id="legend">
  <div class="t">Магнитуда · размер круга</div>
  <div class="row"><i style="background:none;border:1.5px dashed #2f63c4;box-shadow:none"></i>РФ · eqalert.ru</div>
  <div class="row"><i style="background:#51cf66;color:#51cf66"></i>менее 2</div>
  <div class="row"><i style="background:#a9e34b;color:#a9e34b"></i>2 – 3</div>
  <div class="row"><i style="background:#ffd43b;color:#ffd43b"></i>3 – 4</div>
  <div class="row"><i style="background:#ffa94d;color:#ffa94d"></i>4 – 5</div>
  <div class="row"><i style="background:#ff7a45;color:#ff7a45"></i>5 – 6</div>
  <div class="row"><i style="background:#ff4d3d;color:#ff4d3d"></i>6 – 7</div>
  <div class="row"><i style="background:#ff2d2d;color:#ff2d2d"></i>7 и более</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js"></script>

  minZoom: 1.5, maxZoom: 12, zoomSnap: .5,

  }
};

function applyTiles(mode){
  if (tileBase) map.removeLayer(tileBase);
  if (tileRef) map.removeLayer(tileRef);
  tileBase = L.tileLayer(TILES[mode].base, {maxZoom: 16, attribution: ATTR}).addTo(map);

function localizePlace(raw){
  if (!raw) return '—';
  var s = String(raw).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  /* «68 km ENE of …» → «68 км ВСВ от …» */
  s = s.replace(/(\d+)\s*km\s*(NNE|NNW|ENE|ESE|SSE|SSW|WSW|WNW|NE|NW|SE|SW|N|E|S|W)\s+of\s+/gi,
    function(_, n, d){ return n + ' км ' + (DIRS[d.toUpperCase()] || d) + ' от '; });
  s = s.replace(/(\d+)\s*km\s+of\s+/gi, '$1 км от ');
  var i, p;
  for (i = 0; i < PHRASES.length; i++){
    p = PHRASES[i];
    s = s.split(p[0]).join(p[1]);
  }
  s = s.replace(/[A-Za-zА-Яа-я]+/g, function(w){
    var v = WORDS[w.toLowerCase()];
    return v ? v : w;
  });
  s = s.replace(/^\d{4}\s+/, '');
  s = s.replace(/\s{2,}/g, ' ').trim();
  if (s) s = s.charAt(0).toUpperCase() + s.slice(1);
  return s;
}

/* ════════ ВРЕМЯ ════════ */
function fmtTime(ms){
  var d = new Date(ms);
  return d.toLocaleDateString('ru-RU', {day:'2-digit', month:'short'}) + ', ' +
         d.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
}
function fmtAgo(ms){
  var m = Math.floor((Date.now() - ms) / 60000);
  if (m < 1) return 'только что';
  if (m < 60) return m + ' мин назад';
  var h = Math.floor(m / 60);
  if (h < 24) return h + ' ч назад';
  return Math.floor(h / 24) + ' дн назад';
}

/* ════════ ПОПАП ════════ */
function popupHtml(p, depthKm){
  var m = p.mag, c = magColor(m), rows = '';
  rows += '<tr><td>Глубина</td><td>' + depthKm.toLocaleString('ru-RU', {maximumFractionDigits:1}) + ' км</td></tr>';
  rows += '<tr><td>Время</td><td>' + fmtTime(p.time) + ' <small style="color:#7d8590">(' + fmtAgo(p.time) + ')</small></td></tr>';
  if (p.felt > 0) rows += '<tr><td>Ощутили</td><td>' + p.felt + ' сообщ.</td></tr>';
  if (p.src === 'eqalert'){
    rows += '<tr><td>Источник</td><td>' + (AGENCY[p.agency] || p.agency) + ' · eqalert.ru</td></tr>';
  } else {
    rows += '<tr><td>Источник</td><td>' + (p.net || 'usgs').toUpperCase() + '</td></tr>';
  }
  var warn = (p.tsunami === 1) ? '<div class="warn">По этому событию объявлялась угроза цунами</div>' : '';
  return '<div class="eqp">' +
    '<div class="m" style="color:' + c + '">M ' + m.toFixed(1) + '</div>' +
    '<div class="p">' + localizePlace(p.place) + '</div>' +
    '<table>' + rows + '</table>' + warn +
    (p.url ? '<a class="lnk" href="' + p.url + '"' +
      (p.src === 'eqalert' ? '' : ' target="_blank" rel="noopener"') + '>' +
      (p.src === 'eqalert' ? 'Подробнее →' : 'Подробнее на сайте USGS →') + '</a>' : '') +
    '</div>';
}

/* ════════ EQALERT: ПОДПИСИ, КООРДИНАТЫ, ДУБЛИ ════════ */
var AGENCY = {SAK:'Сахалинский филиал ЕГС', EMSC:'EMSC', GFZ:'GFZ', USGS:'USGS'};
function fmtCoords(lat, lon){
  if (lon > 180) lon -= 360;                       /* Чукотка: показать как западную долготу */
  function f(v, pos, neg){ return Math.abs(v).toFixed(1) + '° ' + (v >= 0 ? pos : neg); }
  return f(lat, 'с.ш.', 'ю.ш.') + ', ' + f(lon, 'в.д.', 'з.д.');
}
function eqaRegion(lat, lon){
  for (var i = 0; i < EQA.REGIONS.length; i++){
    var r = EQA.REGIONS[i];
    if (lat >= r[0] && lat <= r[1] && lon >= r[2] && lon <= r[3]) return r[4];
  }
  return '';
}
function isUsgsDup(q){
  if (!lastData) return false;
  var fs = lastData.features;
  for (var i = 0; i < fs.length; i++){
    var f = fs[i], p = f && f.properties;
    if (!p || typeof p.mag !== 'number' || !f.geometry || !f.geometry.coordinates) continue;
    if (ONLY_EARTHQUAKES && p.type !== 'earthquake') continue;
    if (Math.abs((p.time || 0) - q.time) > 600000) continue;             /* ±10 мин */
    var lon = f.geometry.coordinates[0], lat = f.geometry.coordinates[1];
    if (lon < -169 && lat > 60) lon += 360;
    var dx = (lon - q.lon) * Math.cos((lat + q.lat) / 2 * Math.PI / 180);
    var dy = lat - q.lat;
    if (Math.sqrt(dx*dx + dy*dy) < 1.0) return true;                     /* ближе ~1° */
  }
  return false;
}
function rfStroke(){ return (THEME === 'dark') ? '#8ec1ff' : '#2f63c4'; }

/* ════════ ОТРИСОВКА ════════ */
function render(){
  if (!lastData && !lastEqa) return;
  var t = new Date().toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
  var st = document.getElementById('status');
  var rfFit = 0;

  if (lastData){
    layer.clearLayers();
    var feats = lastData.features.filter(function(f){
      return f && f.properties && typeof f.properties.mag === 'number' &&
             f.properties.mag >= MIN_MAG &&
             f.geometry && f.geometry.coordinates &&
             (!ONLY_EARTHQUAKES || f.properties.type === 'earthquake');
    }).sort(function(a, b){ return a.properties.mag - b.properties.mag; }); /* крупные — сверху */
    var strokeCol = (THEME === 'dark') ? '#0a0c0f' : '#20262e';
    var strokeOp  = (THEME === 'dark') ? .9 : .5;

    feats.forEach(function(f){
      var p = f.properties, c = f.geometry.coordinates;
      var lon = c[0], lat = c[1], depth = c[2] || 0, m = p.mag;
      if (lon < -169 && lat > 60) lon += 360;   /* Чукотка: в рамку РФ */
      var col = magColor(m), r = magRadius(m);
      L.circleMarker([lat, lon], {
        radius: r, color: strokeCol, weight: 1.1, opacity: strokeOp,
        fillColor: col, fillOpacity: .78
      }).addTo(layer)
        .bindPopup(popupHtml(p, depth), {className: 'eq-popup', maxWidth: 320, minWidth: 230})
        .bindTooltip('M ' + m.toFixed(1) + ' — ' + localizePlace(p.place), {
          sticky: true, direction: 'top', className: 'eq-tip', offset: [0, -6]
        });
      if (m >= PULSE_FROM_MAG){
        L.marker([lat, lon], {
          interactive: false, keyboard: false,
          icon: L.divIcon({className: '', iconSize: [70, 70],
            html: '<span class="eq-ring" style="border-color:' + col + '"></span>'})
        }).addTo(layer);
      }
    });

    /* статистика */
    var maxF = null, lastF = null;
    feats.forEach(function(f){
      if (!maxF || f.properties.mag > maxF.properties.mag) maxF = f;
      if (!lastF || f.properties.time > lastF.properties.time) lastF = f;
    });
    document.getElementById('st-count').textContent = feats.length;
    document.getElementById('st-max').innerHTML = maxF ?
      'M ' + maxF.properties.mag.toFixed(1) + ' <small>' +
      localizePlace(maxF.properties.place).split(',').pop().trim() + '</small>' : '—';
    document.getElementById('st-last').innerHTML = lastF ?
      'M ' + lastF.properties.mag.toFixed(1) + ' <small>' + fmtAgo(lastF.properties.time) + '</small>' : '—';

    var total = lastData.features.filter(function(f){
      return f && f.properties && typeof f.properties.mag === 'number' &&
             f.geometry && f.geometry.coordinates &&
             (!ONLY_EARTHQUAKES || f.properties.type === 'earthquake');
    }).length;
    st.textContent = 'Обновлено в ' + t + ' · ' + feats.length +
      (feats.length !== total ? ' из ' + total : '') + ' за 24 ч';
    st.classList.remove('err');
  }

  /* ── слой eqalert: РФ и сопредельные районы ── */
  layerRF.clearLayers();
  var rfOn = document.getElementById('rf-on').checked;
  var list = (lastEqa || []).filter(function(q){
    return q.mag >= MIN_MAG && !isUsgsDup(q);
  });
  list.sort(function(a, b){ return a.mag - b.mag; });
  rfFit = list.length;
  if (rfOn){
    list.forEach(function(q){
      var col = magColor(q.mag), r = magRadius(q.mag);
      L.circleMarker([q.lat, q.lon], {
        radius: r, color: rfStroke(), weight: 1.5, opacity: .95, dashArray: '2.5 2.2',
        fillColor: col, fillOpacity: .62
      }).addTo(layerRF)
        .bindPopup(popupHtml(q, q.depth), {className: 'eq-popup', maxWidth: 320, minWidth: 230})
        .bindTooltip('M ' + q.mag.toFixed(1) + ' — ' + q.place + ' · eqalert', {
          sticky: true, direction: 'top', className: 'eq-tip', offset: [0, -6]
        });
      if (q.mag >= PULSE_FROM_MAG){
        L.marker([q.lat, q.lon], {
          interactive: false, keyboard: false,
          icon: L.divIcon({className: '', iconSize: [70, 70],
            html: '<span class="eq-ring" style="border-color:' + col + '"></span>'})
        }).addTo(layerRF);
      }
    });
  }
  document.getElementById('rf-count').textContent = lastEqa ? String(rfFit) : '—';
  if (lastData && rfFit) st.textContent += ' · РФ: ' + rfFit;
}

/* ════════ ЗАГРУЗКА ════════ */
var btn = document.getElementById('refresh');

/* ── фид eqalert: РФ и сопредельные районы (2 bbox-запроса, до PAGES страниц каждый) ── */
function eqaFetch(box, cursor, page, out, done){
  var u = EQA.API + '?mag_min=' + EQA.MAG_MIN +
    '&lat_min=' + box.latMin + '&lat_max=' + box.latMax +
    '&lon_min=' + box.lonMin + '&lon_max=' + box.lonMax +
    '&limit=100' + (cursor ? '&cursor=' + encodeURIComponent(cursor) : '');
  fetch(u).then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(d){
      (d.data || []).forEach(function(it){
        var lv = it.locValues && it.locValues.data;
        if (!lv || typeof lv.lat !== 'number' || typeof lv.lon !== 'number' ||
            typeof lv.mag !== 'number') return;
        var lon = lv.lon;
        if (lon < 0 && lv.lat > 60) lon += 360;   /* Чукотка: в рамку РФ */
        var reg = eqaRegion(lv.lat, lv.lon);
        out.push({
          time: Date.parse(String(lv.event_datetime).replace(' ', 'T') + 'Z'),
          lat: lv.lat, lon: lon, mag: lv.mag, depth: lv.depth || 0,
          id: it.id || '', agency: it.agency || '', src: 'eqalert', url: (it.id ? '/earthquake/' + it.id : ''),
          place: (reg ? reg + ', ' : '') + fmtCoords(lv.lat, lon)
        });
      });
      var nx = d.meta && d.meta.cursor && d.meta.cursor.next;
      if (nx && page < EQA.PAGES) eqaFetch(box, nx, page + 1, out, done);
      else done();
    })
    .catch(done);
}
function loadEqa(){
  var left = EQA.BOXES.length, all = [];
  var fin = function(){
    left--;
    if (left > 0) return;
    all.sort(function(a, b){ return b.time - a.time; });
    lastEqa = all;
    render();
  };
  EQA.BOXES.forEach(function(b){ eqaFetch(b, null, 1, all, fin); });
}

function load(){
  btn.disabled = true; btn.textContent = '…';
  var status = document.getElementById('status');
  status.textContent = 'Загрузка данных…'; status.classList.remove('err');
  loadEqa();   /* фид РФ eqalert грузится параллельно с USGS */

  function tryUrl(i){
    if (i >= DATA_URLS.length){
      status.textContent = 'Не удалось загрузить данные USGS. Проверьте сеть и нажмите «Обновить».';
      status.classList.add('err');
      btn.disabled = false; btn.textContent = 'Обновить';
      return;
    }
    fetch(DATA_URLS[i] + (DATA_URLS[i].indexOf('?') > -1 ? '&' : '?') + '_=' + Date.now())
      .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(data){ lastData = data; render(); })
      .catch(function(){ tryUrl(i + 1); })
      .then(function(){ btn.disabled = false; btn.textContent = 'Обновить'; });
  }
  tryUrl(0);
}
/* ════════ ТЕМА / ФИЛЬТР / АВТООБНОВЛЕНИЕ ════════ */
function restyleMarkers(){
  layer.eachLayer(function(l){
    if (l instanceof L.CircleMarker)
      l.setStyle(THEME === 'dark'
        ? {color: '#0a0c0f', opacity: .9}
        : {color: '#20262e', opacity: .5});
  });
  layerRF.eachLayer(function(l){
    if (l instanceof L.CircleMarker)
      l.setStyle(THEME === 'dark'
        ? {color: '#8ec1ff', opacity: .95}
        : {color: '#2f63c4', opacity: .95});
  });
}
function setTheme(mode){
  THEME = mode;
  document.body.classList.toggle('dark', mode === 'dark');
  applyTiles(mode);
  restyleMarkers();
  document.getElementById('theme').title = (mode === 'dark') ? 'Светлая тема' : 'Тёмная тема';
  try { localStorage.setItem('eq-theme', mode); } catch(e){}
}
document.getElementById('theme').addEventListener('click', function(){
  setTheme(THEME === 'dark' ? 'light' : 'dark');
});
setTheme(THEME);

Array.prototype.forEach.call(document.querySelectorAll('#filter .chips button'), function(b){
  b.addEventListener('click', function(){
    Array.prototype.forEach.call(document.querySelectorAll('#filter .chips button'), function(x){ x.classList.remove('on'); });
    b.classList.add('on');
    MIN_MAG = parseFloat(b.getAttribute('data-m')) || 0;
    render();
  });
});

document.getElementById('rf-on').addEventListener('change', render);

var autoSel = document.getElementById('auto');
var autoTimer = null;
function setAuto(sec){
  clearInterval(autoTimer);
  if (sec > 0) autoTimer = setInterval(load, sec * 1000);
}
autoSel.addEventListener('change', function(){ setAuto(parseInt(autoSel.value, 10) || 0); });
setAuto(parseInt(autoSel.value, 10) || 0);

btn.addEventListener('click', load);
load();

var presetLayer = L.layerGroup().addTo(map);
var presetActive = null;

function presetColor(mag){
  if (mag < 6) return '#ff7a45';
  if (mag < 7) return '#ff4d3d';
  if (mag < 8) return '#ff2d2d';
  return '#c70000';
}
function presetRadius(mag){
  return Math.max(8, Math.min(28, 8 + (mag - 4) * 4));
}

function showPreset(p){
  presetLayer.clearLayers();
  var color = presetColor(p.mag);
  var r = presetRadius(p.mag);
  /* Внешний пульсирующий круг (для M≥7) */
  if (p.mag >= 7){
    L.circleMarker([p.lat, p.lon], {
      radius: r * 1.6, color: color, weight: 1.5, opacity: .55,
      fillColor: color, fillOpacity: .12, className: 'eq-ring'
    }).addTo(presetLayer);
  }
  /* Основной маркер */
  var m = L.circleMarker([p.lat, p.lon], {
    radius: r, color: '#fff', weight: 2, fillColor: color, fillOpacity: .9
  }).addTo(presetLayer);
  m.bindPopup(
    '<div class="eqp">' +
      '<div class="m">M ' + p.mag.toFixed(1) + '</div>' +
      '<div class="p">' + p.place + (p.country ? ' · ' + p.country : '') + '</div>' +
      '<table>' +
        '<tr><td>Год</td><td>' + p.year + '</td></tr>' +
        '<tr><td>Координаты</td><td>' + p.lat.toFixed(2) + '°, ' + p.lon.toFixed(2) + '°</td></tr>' +
        '<tr><td>Источник</td><td><a href="https://earthquake.usgs.gov/earthquakes/" target="_blank" rel="noopener">USGS</a></td></tr>' +
      '</table>' +
    '</div>',
    { className: 'eq-popup', maxWidth: 260 }
  );
  presetLayer.addTo(map);
  presetActive = p;
  /* Летим к эпицентру: зум зависит от магнитуды */
  var z = p.mag >= 8 ? 5 : p.mag >= 7 ? 6 : 7;
  map.flyTo([p.lat, p.lon], z, { duration: 1.2 });
  setTimeout(function(){ m.openPopup(); }, 1300);
}

function clearPreset(){
  presetLayer.clearLayers();
  presetActive = null;
  /* Сбрасываем активную кнопку */
  var btns = document.querySelectorAll('#presets-grid button');
  btns.forEach(function(b){ b.classList.remove('on'); });
}

/* Рендер кнопок пресетов */
(function renderPresets(){
  var grid = document.getElementById('presets-grid');
  if (!grid) return;
  PRESETS.forEach(function(p, i){
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.innerHTML = '<b>' + p.place + '</b><small>M' + p.mag.toFixed(1) + ' · ' + p.year + '</small>';
    btn.addEventListener('click', function(){
      var wasActive = btn.classList.contains('on');
      clearPreset();
      if (wasActive){
        /* Если уже был активен — сбрасываем и возвращаемся к виду по умолчанию */
        try { fitToData(); } catch(e){ map.setView(HOME, HOME_ZOOM); }
        return;
      }
      btn.classList.add('on');
      showPreset(p);
    });
    grid.appendChild(btn);
  });
})();
